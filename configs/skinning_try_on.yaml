log:
  exp_name: a man with bob cut hairstyle_skinning
  # source avatar
  exp_root_path: a man wearing a fez hat
  eval_only: True

optim:
  # transferred hair asset
  ckpt: ./experiments/a fat European woman with bob cut hairstyle refine/checkpoints/step_001000.pth

nerfrender:
  nerf_type: fine_tunning
  skinning_eval: True
